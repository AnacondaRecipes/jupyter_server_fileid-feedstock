{% set name = "jupyter_server_fileid" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1f505d8e651820e62ec4865397d2688f4fec174b472d039a5288d1c1ab857172

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - jupyter-fileid = jupyter_server_fileid.cli:main
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - hatchling >=1.0
  run:
    - python
    - jupyter_server >=2.10,<3
    - jupyter_events >=0.9.0

test:
  source_files:
    - tests
    - conftest.py
    - pyproject.toml
  imports:
    - jupyter_server_fileid
  commands:
    - pip check
    - jupyter-fileid --help
    - pytest -v
  requires:
    - pip
    - pytest
    - pytest-jupyter
    - pytest-cov
    - click

about:
  home: https://github.com/jupyter-server/jupyter_server_fileid
  summary: A Jupyter Server extension providing an implementation of the File ID service.
  description: |
    A Jupyter Server extension providing an implementation of the File ID service.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/jupyter-server/jupyter_server_fileid
  doc_url: https://jupyter-server-fileid.readthedocs.io/

extra:
  recipe-maintainers:
    - davidbrochart
    - dlqqq
    - fcollonval
